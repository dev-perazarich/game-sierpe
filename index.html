<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
  <meta name="theme-color" content="#14161F" />
  <meta name="description" content="Arcade de serpientes con cinco modos de juego, bots con personalidad y cuatro temas visuales. Funciona sin conexión." />
  <title>Sierpe</title>

  <!-- ══ PWA ══ -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <!-- iOS no lee el manifiesto: necesita sus propias etiquetas para
       instalarse a pantalla completa desde "Añadir a pantalla de inicio". -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sierpe" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <!--
    Deliberadamente vacío.

    Si se deja marcado aquí dentro, Vue lo trata como "plantilla en el DOM" y
    manda el parser de HTML, no Vue: <MenuScreen> se convierte en <menuscreen>
    (que Vue ya no resuelve) y el autocierre /> no existe para elementos no-void,
    así que un componente se traga el resto del documento. Con la build de
    producción, además, todo eso falla sin un solo aviso en consola.

    La plantilla raíz vive en src/main.js como cadena, igual que la del resto de
    componentes. Allí no rigen las reglas del parser de HTML.
  -->
  <div id="app"></div>

  <noscript>
    <p style="padding:2rem;font-family:system-ui,sans-serif;color:#e3eae7;background:#04101C">
      Este juego necesita JavaScript activado.
    </p>
  </noscript>

  <!--
    Vue 3 servido desde el propio repositorio, no desde un CDN: el juego tiene
    que arrancar sin conexión, y una dependencia externa lo impediría. Se usa la
    build "global" porque incluye el compilador de plantillas, que hace falta al
    definir los componentes con `template` en cadena sin paso de compilación.

    Va antes que main.js para que `Vue` exista al importar los módulos.

    Para depurar, cambia a vendor/vue.global.js (build de desarrollo): la de
    producción elimina los avisos, y sin paso de compilación esos avisos son la
    única señal cuando algo va mal.
  -->
  <script src="vendor/vue.global.prod.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
